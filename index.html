@media print{
body{background:#fff}.panel{display:none}
#pages{padding:0;gap:0;display:block}

<body>
<div class="panel">
  <h1>Generator Kupon Jalan Sehat — SMKN 6 Schoolverse 2026</h1>
  <label>Jumlah kupon<input type="number" id="jml" min="1" max="9999" value="12"></label>
  <label>Nomor awal<input type="number" id="awal" min="1" max="9999" value="1"></label>
  <button onclick="buat()">Buat Kupon</button>
  <button class="alt" onclick="window.print()">Cetak (A4)</button>
  <span class="info" id="info"></span>
</div>
<div id="pages"></div>
<script>
const $=id=>document.getElementById(id);
const fmt=n=>String(n).padStart(4,'0');
function buat(){
  let awal=Math.min(9999,Math.max(1,parseInt($('awal').value)||1));
  let n=Math.min(9999,Math.max(1,parseInt($('jml').value)||1));
  if(awal+n-1>9999) n=9999-awal+1;
  $('awal').value=awal; $('jml').value=n;
  let h='';
  for(let i=0;i<n;i+=4){
    h+='<div class="page">';
    for(let j=i;j<Math.min(i+4,n);j++){
      const no=fmt(awal+j);
      h+=`<div class="wrap"><div class="coupon"><span class="no l">${no}</span><span class="no r">${no}</span></div></div>`;
    }
    h+='</div>';
  }
  $('pages').innerHTML=h;
  $('info').textContent=`${n} kupon • ${Math.ceil(n/4)} halaman A4 (4 kupon/halaman) • No. ${fmt(awal)} – ${fmt(awal+n-1)}`;
}
['jml','awal'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')buat()}));
buat();
</script>
</body>
